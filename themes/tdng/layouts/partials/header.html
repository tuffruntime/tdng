<div
  class="relative mb-2 flex flex-grow flex-col items-center justify-between gap-4 border-b-3 border-[var(--primary-color)] pb-10 md:flex-row md:px-4 md:py-2"
>
  <div id="page-logo" class="p-5">
    <a
      href="{{ .Site.BaseURL | relLangURL }}"
      class="logo-box text-5xl font-bold text-[var(--primary-color)] no-underline"
    >
      {{ printf "%s | %s" .Site.Title (i18n "subtitle") }}
    </a>
  </div>
  <div id="page-navigation" class="">
    {{ partial "menu.html" (dict "menuID" "main" "page" .) }}
  </div>
</div>
